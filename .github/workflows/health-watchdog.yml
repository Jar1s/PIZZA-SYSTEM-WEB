name: Health Watchdog

# Uptime watchdog: checks the API and all three storefronts every ~5 minutes
# and alerts the ops Telegram chat when anything is down or degraded.
# Complements the in-app Telegram error reporting, which cannot fire when the
# whole backend process is dead.
#
# Required repo secrets (values live in the Render dashboard, service
# pizza-ecosystem-api): TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check endpoints
        id: health
        run: |
          FAILURES=""

          check_http() {
            local label="$1" url="$2"
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 -L "$url" || echo "000")
            if [ "$code" != "200" ]; then
              FAILURES="${FAILURES}${label}: HTTP ${code}%0A"
            fi
          }

          # API health must be HTTP 200 AND report status ok
          BODY=$(curl -s -m 20 "https://api.p0rnopizza.sk/api/health" || echo "")
          if [ -z "$BODY" ]; then
            FAILURES="${FAILURES}API: neodpovedá%0A"
          elif ! echo "$BODY" | grep -q '"status":"ok"'; then
            FAILURES="${FAILURES}API: $(echo "$BODY" | head -c 200)%0A"
          fi

          check_http "p0rnopizza.sk" "https://www.p0rnopizza.sk"
          check_http "pizzaparty.sk" "https://www.pizzaparty.sk"
          check_http "pizzavnudzi.sk" "https://pizzavnudzi.sk"

          if [ -n "$FAILURES" ]; then
            echo "failures=$FAILURES" >> "$GITHUB_OUTPUT"
            echo "status=down" >> "$GITHUB_OUTPUT"
          else
            echo "status=ok" >> "$GITHUB_OUTPUT"
          fi

      - name: Alert Telegram
        if: steps.health.outputs.status == 'down'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FAILURES: ${{ steps.health.outputs.failures }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets are not set — cannot alert"
            exit 1
          fi
          curl -s -m 20 "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="🚨 WATCHDOG — výpadok!%0A${FAILURES}Čas: $(date -u '+%H:%M UTC')" \
            > /dev/null
          # Fail the job so the outage is also visible in the Actions history
          exit 1
