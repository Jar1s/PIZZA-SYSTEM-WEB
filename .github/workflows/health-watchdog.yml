name: Health Watchdog

# Uptime watchdog: checks the API and all eight storefronts every ~5 minutes
# and alerts the ops Telegram chat when anything is down or degraded.
# Complements the in-app Telegram error reporting, which cannot fire when the
# whole backend process is dead.
#
# Required repo secrets (values live in the Render dashboard, service
# pizza-ecosystem-api): TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # Worst case with retries: 9 endpoints x (20s + 30s + 20s) — keep headroom
    # so a total outage still reaches the Telegram alert step.
    timeout-minutes: 15
    steps:
      - name: Check endpoints
        id: health
        run: |
          FAILURES=""

          # One transient miss must not page anyone: every endpoint gets a
          # second attempt after 30s before it counts as down. `|| code=000`
          # (not `|| echo`) so a connect failure reports 000, not 000000 —
          # curl already prints 000 via -w when the request never connects.
          check_http() {
            local label="$1" url="$2"
            local code attempt
            for attempt in 1 2; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 -L "$url") || code="000"
              if [ "$code" = "200" ]; then
                return 0
              fi
              [ "$attempt" = "1" ] && sleep 30
            done
            FAILURES="${FAILURES}${label}: HTTP ${code}%0A"
          }

          # API health must be HTTP 200 AND report status ok (same retry rule)
          check_api() {
            local body attempt
            for attempt in 1 2; do
              body=$(curl -s -m 20 "https://api.p0rnopizza.sk/api/health") || body=""
              if echo "$body" | grep -q '"status":"ok"'; then
                return 0
              fi
              [ "$attempt" = "1" ] && sleep 30
            done
            if [ -z "$body" ]; then
              FAILURES="${FAILURES}API: neodpovedá%0A"
            else
              FAILURES="${FAILURES}API: $(echo "$body" | head -c 200)%0A"
            fi
          }
          check_api

          check_http "p0rnopizza.sk" "https://www.p0rnopizza.sk"
          check_http "pizzaparty.sk" "https://www.pizzaparty.sk"
          check_http "pizzavnudzi.sk" "https://pizzavnudzi.sk"
          check_http "pizzalover.sk" "https://pizzalover.sk"
          check_http "pizzaprefirmy.sk" "https://pizzaprefirmy.sk"
          check_http "threesomepizza.sk" "https://threesomepizza.sk"
          check_http "skinnyb1tchpizza.sk" "https://skinnyb1tchpizza.sk"
          check_http "ozemp1cpizza.sk" "https://ozemp1cpizza.sk"

          if [ -n "$FAILURES" ]; then
            echo "failures=$FAILURES" >> "$GITHUB_OUTPUT"
            echo "status=down" >> "$GITHUB_OUTPUT"
          else
            echo "status=ok" >> "$GITHUB_OUTPUT"
          fi

      - name: Alert Telegram
        if: steps.health.outputs.status == 'down'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FAILURES: ${{ steps.health.outputs.failures }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets are not set — cannot alert"
            exit 1
          fi
          curl -s -m 20 "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="🚨 WATCHDOG — výpadok!%0A${FAILURES}Čas: $(date -u '+%H:%M UTC')" \
            > /dev/null
          # Fail the job so the outage is also visible in the Actions history
          exit 1
