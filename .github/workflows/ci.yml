name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail on tracked artifacts and duplicate temp files
        shell: bash
        run: |
          set -euo pipefail

          patterns='(^|/)(\.DS_Store|\.next(/|$)|dist(/|$)|node_modules(/|$)|\.vercel(/|$)|\.vscode(/|$)|.*\.log$|.*\.tsbuildinfo$|backend/shared(/|$)|frontend/shared(/|$)|backend/frontend(/|$)|frontend/backend(/|$)|public 2(/|$)|.* 2\.(ts|tsx|js|jsx|md|json|sh)$)'
          tracked_violations="$(git ls-files | grep -E "$patterns" || true)"

          if [[ -n "$tracked_violations" ]]; then
            printf 'Tracked hygiene violations found:\n%s\n' "$tracked_violations"
            exit 1
          fi

          dirty_tree="$(git status --short --untracked-files=no || true)"
          if [[ -n "$dirty_tree" ]]; then
            printf 'Unexpected tracked changes in checkout:\n%s\n' "$dirty_tree"
            exit 1
          fi

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Prepare shared package mirror
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backend/shared
          cp -R shared backend/shared

      - name: Install dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: backend
        run: npm run prisma:generate

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Run backend tests
        working-directory: backend
        run: npm test

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare shared package mirror
        shell: bash
        run: |
          set -euo pipefail
          rm -rf frontend/shared
          cp -R shared frontend/shared

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        # The production-build guard in next.config.js refuses to build without
        # NEXT_PUBLIC_API_URL (so a misconfigured deploy can never bake in
        # localhost). CI is not a deploy — give it a placeholder API URL.
        env:
          NEXT_PUBLIC_API_URL: https://api.p0rnopizza.sk
        run: npm run build

      - name: Type check frontend
        working-directory: frontend
        run: npm run type-check

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare shared package mirror
        shell: bash
        run: |
          set -euo pipefail
          rm -rf frontend/shared
          cp -R shared frontend/shared

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test
