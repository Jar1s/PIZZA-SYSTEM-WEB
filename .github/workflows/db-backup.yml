name: DB Backup

# Independent, off-provider PostgreSQL backup for the Supabase production database.
# Runs daily, dumps via pg_dump, verifies the archive, encrypts it (GPG AES-256)
# and uploads to S3-compatible storage (AWS S3 or Backblaze B2). See docs/db-backup.md.

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC daily (~03:00/04:00 CET)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, encrypt & upload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # --- Supabase connection (USE THE SESSION POOLER URI, port 5432 — see docs) ---
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGSSLMODE: require
      # --- Encryption ---
      BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
      # --- S3-compatible storage ---
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }} # optional: for Backblaze B2 / non-AWS
      BACKUP_S3_PREFIX: postgres
      BACKUP_RETENTION_DAYS: '30'

    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for v in SUPABASE_DB_URL BACKUP_GPG_PASSPHRASE AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION BACKUP_S3_BUCKET; do
            if [[ -z "${!v:-}" ]]; then missing+=("$v"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - name: Dump database
        shell: bash
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "DATE_PATH=$(date -u +%Y/%m/%d)" >> "$GITHUB_ENV"
          # -Fc custom format (compressed, restorable with pg_restore), --no-owner eases
          # restore into a fresh Supabase project. Dumps all schemas the role can read.
          pg_dump "$SUPABASE_DB_URL" \
            --format=custom \
            --compress=9 \
            --no-owner \
            --no-privileges \
            --file "backup-${STAMP}.dump"
          ls -lh "backup-${STAMP}.dump"

      - name: Verify dump integrity
        shell: bash
        run: |
          set -euo pipefail
          FILE="backup-${STAMP}.dump"
          # Archive must be readable by pg_restore and contain a reasonable number of objects.
          OBJECTS="$(pg_restore --list "$FILE" | grep -cE '^[0-9]' || true)"
          SIZE="$(stat -c%s "$FILE")"
          echo "Archive objects: $OBJECTS, size: $SIZE bytes"
          if [[ "$SIZE" -lt 1024 ]]; then echo "::error::Dump suspiciously small (<1KB)"; exit 1; fi
          if [[ "$OBJECTS" -lt 1 ]]; then echo "::error::Dump contains no objects"; exit 1; fi

      - name: Encrypt dump (GPG AES-256)
        shell: bash
        run: |
          set -euo pipefail
          FILE="backup-${STAMP}.dump"
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_GPG_PASSPHRASE" \
            --output "${FILE}.gpg" "$FILE"
          rm -f "$FILE"
          ls -lh "${FILE}.gpg"

      - name: Upload to S3-compatible storage
        shell: bash
        run: |
          set -euo pipefail
          FILE="backup-${STAMP}.dump.gpg"
          KEY="${BACKUP_S3_PREFIX}/${DATE_PATH}/${FILE}"
          ENDPOINT_ARG=()
          if [[ -n "${BACKUP_S3_ENDPOINT:-}" ]]; then ENDPOINT_ARG=(--endpoint-url "$BACKUP_S3_ENDPOINT"); fi
          aws s3 cp "$FILE" "s3://${BACKUP_S3_BUCKET}/${KEY}" \
            "${ENDPOINT_ARG[@]}" --only-show-errors
          echo "✅ Uploaded s3://${BACKUP_S3_BUCKET}/${KEY}"

      - name: Prune backups older than retention window
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT_ARG=()
          if [[ -n "${BACKUP_S3_ENDPOINT:-}" ]]; then ENDPOINT_ARG=(--endpoint-url "$BACKUP_S3_ENDPOINT"); fi
          CUTOFF="$(date -u -d "${BACKUP_RETENTION_DAYS} days ago" +%s)"
          aws s3 ls "s3://${BACKUP_S3_BUCKET}/${BACKUP_S3_PREFIX}/" --recursive "${ENDPOINT_ARG[@]}" \
            | while read -r d _t _size key; do
                [[ -z "$key" ]] && continue
                fdate="$(date -u -d "$d" +%s 2>/dev/null || echo 0)"
                if [[ "$fdate" -gt 0 && "$fdate" -lt "$CUTOFF" ]]; then
                  echo "Pruning old backup: $key"
                  aws s3 rm "s3://${BACKUP_S3_BUCKET}/${key}" "${ENDPOINT_ARG[@]}" --only-show-errors || true
                fi
              done

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### DB backup run" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Timestamp: ${STAMP:-n/a}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Retention: ${BACKUP_RETENTION_DAYS} days" >> "$GITHUB_STEP_SUMMARY"
