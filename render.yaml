services:
  - type: cron
    name: pizza-db-backup
    runtime: docker
    region: frankfurt
    plan: starter
    schedule: '0 2 * * *'
    dockerfilePath: ./backup/Dockerfile
    dockerContext: .
    dockerCommand: /app/scripts/backup-db.sh
    envVars:
      - key: BACKUP_TARGET
        value: google_drive
      - key: SUPABASE_DB_URL
        sync: false
      - key: BACKUP_GPG_PASSPHRASE
        sync: false
      - key: GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON_BASE64
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: 11aOtnxPUY-bicyJmNa4ts9tRLO9uJXtE
      - key: BACKUP_S3_PREFIX
        value: postgres
      - key: BACKUP_RETENTION_DAYS
        value: "30"
      - key: BACKUP_PRUNE_ENABLED
        value: "false"

