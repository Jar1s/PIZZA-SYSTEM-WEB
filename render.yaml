services:
  - type: web
    name: pizza-ecosystem-api
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: cd backend && npm ci && npm run build && npm run prisma:deploy
    startCommand: cd backend && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
    healthCheckPath: /api/health

  - type: cron
    name: pizza-db-backup
    runtime: docker
    region: frankfurt
    plan: starter
    schedule: '0 2 * * *'
    dockerfilePath: ./backup/Dockerfile
    dockerContext: .
    dockerCommand: /app/scripts/backup-db.sh
    envVars:
      - key: BACKUP_TARGET
        value: google_drive
      - key: SUPABASE_DB_URL
        sync: false
      - key: BACKUP_GPG_PASSPHRASE
        sync: false
      - key: GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON_BASE64
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_PREFIX
        value: postgres
      - key: BACKUP_RETENTION_DAYS
        value: "30"
      - key: BACKUP_PRUNE_ENABLED
        value: "false"



