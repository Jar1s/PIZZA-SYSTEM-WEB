services:
  # Production API. Migrations run as part of the build (`prisma migrate deploy`)
  # so a deploy never lands code against an un-migrated schema. Render runs the
  # build once per deploy, so this is safe even with the starter plan.
  # Secrets below use `sync: false` (set them in the Render dashboard). Additional
  # integration secrets (SMTP, Adyen/GoPay/WePay, Wolt, Twilio, Sentry, OAuth) are
  # also managed in the dashboard.
  - type: web
    name: pizza-ecosystem-api
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: cd backend && npm ci && npm run build && npm run prisma:deploy
    startCommand: cd backend && npm run start:prod
    healthCheckPath: /api/health
    # Persistent volume for product-image uploads. Without it the filesystem is
    # ephemeral and every deploy wipes backend/uploads.
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false

  - type: cron
    name: pizza-db-backup
    runtime: docker
    region: frankfurt
    plan: starter
    schedule: '0 2 * * *'
    dockerfilePath: ./backup/Dockerfile
    dockerContext: .
    dockerCommand: /app/scripts/backup-db.sh
    envVars:
      - key: BACKUP_TARGET
        value: s3
      - key: SUPABASE_DB_URL
        sync: false
      - key: BACKUP_GPG_PASSPHRASE
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_BUCKET
        value: pizza-db-backups
      - key: BACKUP_S3_REGION
        value: auto
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_PREFIX
        value: postgres
      - key: BACKUP_RETENTION_DAYS
        value: "30"
      - key: BACKUP_PRUNE_ENABLED
        value: "false"
