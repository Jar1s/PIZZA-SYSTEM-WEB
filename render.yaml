services:
  - type: cron
    name: pizza-db-backup
    runtime: docker
    region: frankfurt
    plan: starter
    schedule: '0 2 * * *'
    dockerfilePath: ./backup/Dockerfile
    dockerContext: .
    dockerCommand: /app/scripts/backup-db.sh
    envVars:
      - key: BACKUP_TARGET
        value: s3
      - key: SUPABASE_DB_URL
        sync: false
      - key: BACKUP_GPG_PASSPHRASE
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_BUCKET
        value: pizza-db-backups
      - key: BACKUP_S3_REGION
        value: auto
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_PREFIX
        value: postgres
      - key: BACKUP_RETENTION_DAYS
        value: "30"
      - key: BACKUP_PRUNE_ENABLED
        value: "false"
